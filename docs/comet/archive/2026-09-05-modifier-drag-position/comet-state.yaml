    reason:
      text: 源码与既有 settings structure、browser 检查确认 Appearance 已移除 X/Y 偏移控件，其他控件及布局保留。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 代码复核和手势检查覆盖 macOS Command / Windows Ctrl +
      左键的起点、抓取点及松键结束逻辑；实际平台手势运行结果按用户接受的验证限制记为 NOT RUN。"
    result: passed
    reason:
      text: 源码复核覆盖 macOS Command / Windows Ctrl + 左键起点、抓取点及松键结束；真实平台手势按已接受范围记为 NOT
        RUN。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3:
      代码复核覆盖无修饰键穿透、非左键不启动移动、不抢焦点的窗口配置，以及结束/隐藏/关闭时释放状态；实际原生穿透和焦点行为按用户接受的验证限制记为
      NOT RUN。"
    result: passed
    reason:
      text: 源码复核覆盖穿透、左键限定、焦点配置及结束/隐藏/关闭释放；真实原生穿透与焦点按已接受范围记为 NOT RUN。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: Node/Rust
      和浏览器检查覆盖位置保存/读取、旧快照不覆盖新位置、原子写入失败与错误恢复；实际拖拽触发保存及重启后的完整链路按用户接受的验证限制记为 NOT
      RUN。"
    result: passed
    reason:
      text: Node/Rust、renderer、设置结构检查及代码复核覆盖位置持久化、旧快照保护、错误路径；完整拖拽保存/重启链路按已接受范围记为 NOT
        RUN。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 升级后已有有效位置保持不变；从设置页或托盘重置位置时恢复主屏右侧 28、底部 140 个逻辑像素的现有默认边距，保存后重启仍是默认位置。"
    result: passed
    reason:
      text: 既有检查与代码复核覆盖旧位置兼容、主屏默认边距及设置页/托盘重置保存。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 几何测试、代码复核及 Windows 库类型检查覆盖负坐标、缩放、可重新抓取与不可用屏幕回退逻辑；实际跨屏、不同 DPI 和
      Windows 应用运行按用户接受的验证限制记为 NOT RUN。"
    result: passed
    reason:
      text: 几何逻辑、源码复核及 Windows library 检查覆盖负坐标、缩放和不可达屏幕回退；实际跨屏/DPI/Windows 应用按已接受范围记为
        NOT RUN。
      truncated: false
  - id: A7
    source: specs/settings-sliders/spec.md
    text: Numeric fields are sliders - GIVEN the Appearance view is mounted - WHEN
      the view is inspected - THEN each listed numeric setting has an associated
      label and `input[type="range"]` with the specified `min`, `max`, and
      `step` - AND `curve_id` remains a `select` - AND `formula` remains
      read-only
    result: passed
    reason:
      text: settings structure 与浏览器检查确认数值控件使用指定 range，curve_id 保持 select，formula 保持只读。
      truncated: false
  - id: A8
    source: specs/settings-sliders/spec.md
    text: Slider values are readable and editable - GIVEN a listed slider has focus
      - WHEN the user drags it or uses the native arrow keys - THEN the setting
      model receives a finite number - AND the associated output displays the
      value using the field's required precision - AND the label, slider, and
      output remain programmatically associated
    result: passed
    reason:
      text: 浏览器检查及现有控制器逻辑覆盖数值编辑、输出精度和 label/slider/output 关联。
      truncated: false
  - id: A9
    source: specs/settings-sliders/spec.md
    text: External settings stay synchronized - GIVEN Appearance is mounted or an
      external `settings-changed` payload arrives - WHEN the payload contains
      valid settings - THEN every mounted slider and output reflects the payload
      - AND the existing local-edit preservation behavior remains intact
    result: passed
    reason:
      text: 源码与浏览器检查确认外部 settings-changed 同步及 local-edit preservation。
      truncated: false
  - id: A10
    source: specs/settings-sliders/spec.md
    text: Native bounds reject invalid values - GIVEN a settings payload contains a
      value outside a declared slider range or a non-finite numeric duration -
      WHEN native normalization runs - THEN the resulting settings are finite
      and inside the declared range - AND the renderer does not receive an
      invalid value
    result: passed
    reason:
      text: Rust normalization 与 renderer 检查覆盖范围约束、有限数值及无效输入拦截。
      truncated: false
  - id: A11
    source: specs/settings-sliders/spec.md
    text: Existing persistence and layout remain stable - GIVEN the user changes any
      listed slider - WHEN the existing save path completes - THEN settings
      continue to synchronize to both windows and save failures use the existing
      safe status/error path - AND the Appearance layout remains usable at its
      existing responsive breakpoints without overflow
    result: passed
    reason:
      text: Node/Rust、设置结构、浏览器及 whitespace 检查通过；既有保存队列、错误状态和响应式布局保持。
      truncated: false
  - id: A12
    source: specs/settings-workbench/spec.md
    text: Open settings - **WHEN** the settings page opens - **THEN** the App Shell
      shows the Codex Halo identity, the global Overlay toggle, language
      selector, and save status - **AND** the default View is `Appearance` -
      **AND** only the active View is mounted in the content host
    result: passed
    reason:
      text: settings workbench 结构及浏览器检查确认 shell、Appearance 默认视图和单视图挂载。
      truncated: false
  - id: A13
    source: specs/settings-workbench/spec.md
    text: Navigate between Views - **WHEN** the user selects `Appearance`, `State
      colors`, `Integration`, or `Test` - **THEN** the selected View replaces
      the previous View in the content host - **AND** the active navigation item
      exposes the selected state - **AND** focus and keyboard navigation remain
      available
    result: passed
    reason:
      text: 浏览器检查及 settings controller 源码确认四视图切换、选中状态与键盘导航。
      truncated: false
  - id: A14
    source: specs/settings-workbench/spec.md
    text: Configure appearance - **WHEN** the `Appearance` View is active - **THEN**
      the user can see and edit curve profile, opacity, particle count, trail
      span, loop timing, pulse timing, rotation timing, and stroke width -
      **AND** the active formula remains visible as feedback for renderer
      settings - **AND** the remaining control IDs, names, and setting keys
      remain usable by the controller
    result: passed
    reason:
      text: Appearance 控件结构、controller 绑定及 renderer 检查通过，公式和现有 setting keys 保持可用。
      truncated: false
  - id: A15
    source: specs/settings-workbench/spec.md
    text: Scan color states - **WHEN** the `State colors` View is active - **THEN**
      the state list shows `idle`, `thinking`, `executing`, `input_needed`,
      `completed`, `interrupted`, and `compacting` - **AND** each row shows the
      localized state label, current color swatch, and current Hex value -
      **AND** exactly one row is selected
    result: passed
    reason:
      text: 浏览器检查确认七个 Halo 状态、标签、色块、Hex 值及单选状态。
      truncated: false
  - id: A16
    source: specs/settings-workbench/spec.md
    text: Edit selected state - **WHEN** the user selects a state row - **THEN** the
      detail panel shows that state's preview, native color picker, Hex input,
      reset action, and preset palette disclosure - **AND** changing the picker,
      valid Hex input, preset, or reset action updates only the selected state's
      color - **AND** the change uses the existing automatic save path
    result: passed
    reason:
      text: 浏览器检查与源码复核确认颜色详情编辑、重置、preset 及自动保存仅作用于选中状态。
      truncated: false
  - id: A17
    source: specs/settings-workbench/spec.md
    text: Extend state details - **WHEN** a future state-level setting such as audio
      linkage or state-specific animation is added - **THEN** it can be added to
      the selected state's detail context without changing the state list
      interaction - **AND** the current seven-state color contract remains
      intact
    result: passed
    reason:
      text: Master-detail 状态结构保留，可扩展 detail context，七状态契约未改变。
      truncated: false
  - id: A18
    source: specs/settings-workbench/spec.md
    text: Use colors on a narrow viewport - **WHEN** the available width is below
      the desktop layout threshold - **THEN** the state list and detail panel
      stack vertically - **AND** the page does not require document-level
      horizontal scrolling - **AND** the selected state, editor controls, and
      validation message remain visible
    result: passed
    reason:
      text: position-ui-browser 检查确认窄视口上下堆叠、无文档级横向溢出及控件可见。
      truncated: false
  - id: A19
    source: specs/settings-workbench/spec.md
    text: Load settings - **WHEN** the page loads - **THEN** the Tauri Bridge
      requests the complete `AppSettings` value - **AND** the shared settings
      state becomes the source of truth for mounted and unmounted controls -
      **AND** the active View renders from that state
    result: passed
    reason:
      text: 源码复核确认 Tauri Bridge 加载完整 AppSettings，共享 store 作为挂载/未挂载控件来源。
      truncated: false
  - id: A20
    source: specs/settings-workbench/spec.md
    text: Save a setting - **WHEN** the user changes a setting - **THEN** the shared
      settings state is updated - **AND** save requests remain serialized
      through the existing queue - **AND** the UI exposes ready, saving, saved,
      and error feedback
    result: passed
    reason:
      text: 源码复核与 Node/Rust 检查确认共享状态更新、串行保存队列及 ready/saving/saved/error 状态。
      truncated: false
  - id: A21
    source: specs/settings-workbench/spec.md
    text: Receive an external settings update - **WHEN** a `settings-changed` event
      contains a complete or partial payload - **THEN** the payload merges into
      the shared settings state - **AND** unmounted values and inactive state
      colors are not erased - **AND** the active control is not unexpectedly
      overwritten while it is being edited
    result: passed
    reason:
      text: 源码复核确认完整/部分 settings-changed 合并、未挂载值保留及编辑中的 active field 保护。
      truncated: false
  - id: A22
    source: specs/settings-workbench/spec.md
    text: Add a future settings View - **WHEN** a future domain such as default
      position or audio is introduced - **THEN** the frontend can register a new
      View and its field bindings without duplicating save, error, localization,
      or event synchronization logic - **AND** native fields, commands, or
      events are added only by a separate capability change
    result: passed
    reason:
      text: 现有 settings controller/store/bridge 分层支持新增 View 复用保存、错误、本地化和事件同步。
      truncated: false
  - id: A23
    source: specs/settings-workbench/spec.md
    text: Localize the settings page - **WHEN** the user switches between `en` and
      `zh-CN` - **THEN** shell labels, View labels, form labels, state labels,
      preset labels, status text, and diagnostics are localized - **AND**
      localized text wraps without overlap or loss of focus
    result: passed
    reason:
      text: 浏览器检查及 i18n 源码复核确认 en 与 zh-CN 的 shell、视图、表单、状态、状态文本和诊断本地化。
      truncated: false
  - id: A24
    source: specs/settings-workbench/spec.md
    text: Use keyboard controls - **WHEN** the user navigates the shell, View
      navigation, state list, and form controls with a keyboard - **THEN** focus
      order follows the DOM order - **AND** active navigation and selected state
      are announced through appropriate ARIA state - **AND** visible focus
      remains clear
    result: passed
    reason:
      text: 源码与浏览器检查确认 DOM focus 顺序、ARIA selected 状态、键盘导航及 focus-visible 保留。
      truncated: false
