    text: "**A3**：20 个 profile 在 `detailScale` 为 `0`、`0.5`、`1` 和完整采样范围内均返回有限且位于
      renderer 既有校验边界 `[-20,120]` 内的坐标；现有 renderer self-check 通过。"
    result: passed
    reason:
