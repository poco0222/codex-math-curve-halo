      truncated: false
  - id: A4
    source: brief.md
    text: "**A4**：默认设置使用 `original-thinking`；`rose-seven`、`fourier-flow` 设置值加载后回退到
      `original-thinking`，`lissajous-drift`、`spiral-search` 保持对应目标案例，并可正常保存新值。"
    result: passed
