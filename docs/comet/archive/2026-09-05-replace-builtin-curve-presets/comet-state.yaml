        仅排除两项已有窗口尺寸断言。
      truncated: false
  - id: A6
    source: specs/curve-profiles/spec.md
    text: Select a built-in profile - **WHEN** the Appearance view is opened -
      **THEN** the curve selector contains exactly the 20 IDs and labels above
      in the same order - **AND** `fourier-flow` is absent - **AND** the active
      formula output describes the selected profile
    result: passed
    reason:
      text: 实际 Appearance 页面显示指定的 20 项目录和默认公式。src/settings.js:460、647 将选择变更及视图重挂载连接到
        renderFormula；每项公式由 Runtime renderer 检查确认含坐标与脉冲定义。
      truncated: false
  - id: A7
    source: specs/curve-profiles/spec.md
    text: Render every profile - **WHEN** each profile is sampled at 128 points with
      `detailScale` values `0`, `0.5`, and `1` - **THEN** every point has finite
      `x` and `y` values - **AND** every point remains within the existing
      validation bounds `[-20,120]` on both axes - **AND** the profile has a
      non-empty formula
    result: passed
    reason:
      text: scripts/check-renderer.mjs:118 对每项执行 128 点、detailScale=0/0.5/1
        的有限值、边界及非空公式断言；Runtime renderer.log 返回 PASS，无检查失败。
      truncated: false
  - id: A8
    source: specs/curve-profiles/spec.md
    text: Load legacy settings - **WHEN** a persisted settings file contains a
      removed or unknown `curve_id` - **THEN** the native settings value
      returned to both windows is `original-thinking` - **AND** saving the
      normalized settings writes the new ID - **WHEN** a persisted settings file
      contains `lissajous-drift` or `spiral-search` - **THEN** that curve ID
      remains unchanged
    result: passed
    reason:
      text: src-tauri/src/main.rs:249 的 load_settings_file 在返回前
        normalize，值变化时写回；get_settings 共用此入口，save_settings_unlocked 同样先
        normalize。Rust 迁移及全部有效 ID 往返测试通过，lissajous-drift、spiral-search
        保留；双窗口取得同一规范化契约。
      truncated: false
  - id: A9
    source: specs/curve-profiles/spec.md
    text: Change profile without changing global settings - **WHEN** the user
      selects any of the 20 profiles - **THEN** the existing auto-save path
      persists only `curve_id` and current generic settings - **AND** particle
      count, trail span, durations, stroke width, state colors, and cross-window
      synchronization keep their existing behavior
    result: passed
    reason:
      text: AppSettings 未新增字段；src/settings.js:199、311、647 仍通过现有 Store 更新 curve_id
