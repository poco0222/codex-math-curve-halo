acceptance:
  - id: A1
    source: brief.md
    text: A1：两个不同会话分别思考和执行时，同一光环同时出现各状态的配置颜色；等待输入的第三个会话出现后，已有两种状态仍可见。
    result: passed
    reason:
      text: state.rs::reduce_snapshots 输出完整 sessions；app.js::applyRendererDisplayState
        将集合传给 renderer。Runtime 前端 overlay forwards every session
        和多曲线混色测试通过；dark-mixed.png 显示混合状态同时呈现。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：一个会话从执行切换到完成或结束时，另一个仍在思考的会话保持其状态，不被前者覆盖或清空。
    result: passed
    reason:
      text: SessionStore 按 session_key 更新和删除；Runtime
        session_updates_and_removals_preserve_all_other_sessions 与 renderer
        terminal exit 测试通过，单会话完成、移除或过期后保留其他会话。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：调整某一状态的配置颜色后，所有处于该状态的显示部分同步更新，其他状态保持自身配色；单会话仍呈现对应状态颜色。
    result: passed
    reason:
      text: halo.js::styleFor 读取各状态配置色，setSettings 逐会话更新对应颜色；Runtime 自定义颜色、单会话换色、13
        条同色流光同步改色及既有颜色配置检查通过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：事件推送与轮询响应交错时，较旧响应不能覆盖已经应用的新显示；非法或无效快照不能破坏其他有效会话状态。
    result: passed
    reason:
      text: app.js::createDisplayStateBridge 用 appliedGeneration 防止旧响应回滚已应用状态。Runtime
        乱序轮询、推送覆盖进行中轮询、慢轮询和失败响应检查通过；Rust
        mixed_valid_and_corrupt_files_keep_valid_snapshots、未来时间戳拒绝及扫描错误保留集合检查通过。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：两个思考中、一个执行中、一个等待输入的会话同时存在时，显示四条独立流光，颜色分别读取
      thinking_color、thinking_color、executing_color、input_needed_color；其中一个会话变更状态只改变自身流光颜色。不得硬编码为默认颜色。
    result: passed
    reason:
      text: Runtime display_serializes_every_current_session_in_stable_key_order 验证两个
        thinking、一个 executing、一个 input_needed 独立输出；halo.js 按会话创建亮芯并通过
        STATE_COLOR_KEYS 取色，不按状态合并。混色与同色四会话浏览器截图支持对应显示。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：thinking、executing、compacting 会话超过 60 秒没有新事件仍显示最后状态；input_needed
      同样保留。重新启动 Halo 后，只要对应合法快照仍在，也继续显示这些最后已知状态；不将其计数描述为经存活探测确认的在线数。
    result: passed
    reason:
      text: state.rs::expiry_ms 对 thinking、executing、compacting、input_needed
        不设时间失效；Runtime keeps_running_states_until_another_event 和
        fresh_runtime_restores_old_running_snapshots_and_isolates_invalid_files
        验证跨一天及新建 Runtime 恢复。中英文 README 明确计数与显示属于最后已知状态，无存活探测。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：completed 和 interrupted 在 3 秒保留期内显示各自颜色，超过 3 秒移除；SessionEnd 移除自身流光；idle
      继续采用原有 60 秒失效规则。最后一条有效流光移除后显示原有空闲光环。
    result: passed
    reason:
      text: Runtime 终态三秒失效、精确有效期边界、SessionEnd 删除对应快照、SessionStore 过期清理检查通过；renderer
        按原事件时间移除终态，空集合恢复原 idle 渲染，运行中同伴保持。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：重复轮询或改变会话遍历顺序不交换流光的会话身份；新增、移除和切换状态不重置其他流光动画。2、4、13
      个有效会话均逐一呈现，不按状态合并或静默截断。
    result: passed
    reason:
      text: halo.js::updateSessions 以 session_key 保留对象和 offset，只分配新会话位置；Runtime
        重排、新增、删除、模拟恢复位置保持检查，以及全部内置曲线下 2、4、13 独立亮芯检查通过；无集合截断。
      truncated: false
  - id: A9
    source: brief.md
    text: A9：状态模拟暂时呈现模拟颜色，不修改真实会话集合或增加真实会话计数；模拟结束后恢复完整多会话流光。关闭动画偏好时仍同时呈现各条流光的状态颜色。
    result: passed
    reason:
      text: SessionStore::display_state_with_override 保留真实计数，app.js 模拟分支不覆盖真实 renderer
        集合。Runtime 模拟隔离、完整恢复、运行模拟独立失效及 reduced motion
        静态同色亮芯检查通过；浏览器证据包含模拟往返恢复四会话和减少动态效果截图。
      truncated: false
  - id: A10
    source: brief.md
    text: A10：多会话采用独立亮芯与渐隐细尾，流动节奏轻微错开且不随机跳位或无界追尾；换状态时新配置颜色从亮芯沿尾部传播，并在 420ms
      内完成。新线程从短光芽展开；完成或中断在原有 3 秒反馈期末收束淡出。增多至 13
      线程时缩短尾迹、收敛光晕，保留各亮芯和可见暗隙；降低动态效果时保持静态多色辨识。
    result: passed
    reason:
      text: Runtime
        验证亮芯先换色、尾迹于420ms内完成、高频换色连续、420ms进入展开、按原三秒期限退出、13条同色交叉暗隙、动态交叉连续性、8逻辑像素位移上界及亮芯最后绘制。112px明暗截图覆盖默认、玫瑰与开放曲线，显示独立亮芯、渐隐细尾和密度缩尾；reduced
        motion 保持静态辨识。
      truncated: false
