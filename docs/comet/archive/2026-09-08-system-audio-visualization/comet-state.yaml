  - id: A1
    source: brief.md
    text: A1：首次打开及加载旧配置时，音频开关默认关闭、强度默认
      50%；未开启前不采集、不请求音频权限。保存开启后重启，在平台支持、权限允许且悬浮层显示时恢复采集。
    result: passed
    reason:
      text: 保留未变化场景的既有通过结论；本轮 Runtime 回归通过。配置默认关闭、强度 50%
        与采集门控有代码及测试证据；native-observations.json 记录首次关闭及保存开启、强度后重启恢复。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：macOS 真实采集能取得系统播放的频段特征，真实 App 能反映播放/静音状态；事件接线复核及受控 renderer
      检查确认特征进入曲线响应。真实悬浮层播放/停播直接对照观察经用户接受延期，保留 NOT RUN /
      deferred，不将链路分段证据描述为原生视觉端到端验收。
    result: passed
    reason:
      text: 按当前 brief/spec 的证据门禁通过。native-capture.txt 记录真实 macOS
        系统采集取得低中高频；native-observations.json 记录真实 App 播放后进入采集、停播后静音归零。main.rs 的
        audio-state 发送、app.js 的监听及 halo.js 的 setAudioFrame 接收链相符，Runtime
        renderer 测试通过。真实悬浮层播放/停播直接对照观察仍 NOT RUN/deferred；不构成原生视觉端到端通过。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：分别输入低频、中频、高频测试信号时，低频主要改变曲线围绕中心的尺度，中频主要改变粒子行进速度，高频主要改变有界细节；全目录曲线保持辨识度、边界内绘制及粒子贴合路径。
    result: passed
    reason:
      text: 保留既有通过结论；本轮 src/audio.test.mjs 随 Runtime Node
        检查通过，覆盖独立低中高频在单曲线及会话路径中的响应、全目录边界及数量保持。合成频段曲线截图与映射实现一致。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：强度滑块为 0～100%，默认 50%；0% 不叠加音频动效，100% 仍不裁切、闪烁或改变状态色。连续拖动不造成相位跳变或覆盖原始动画参数。
    result: passed
    reason:
      text: 保留既有通过结论；Runtime 测试覆盖 0% 原始输出、100% 全目录边界、强度范围及持久化。renderer 使用瞬时调制与累计相位；真实
        App 观察记录强度调整、保存和重启保留。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：静音或音频帧超过 500 ms 未更新时，旧特征失效，额外动效在随后 1
      秒内平滑归零。关闭、隐藏悬浮层、应用退出均释放采集资源；重新显示按已保存意图恢复，不重复创建采集器。
    result: passed
    reason:
      text: 保留既有通过结论；Control、renderer 与 Runtime 测试覆盖 500 ms 过期、平滑释放和采集门控。真实 UI
        记录停播归零、隐藏暂停及恢复；native-capture.txt 确认停止后 25 ms 内 tap/aggregate 注销。单采集器及退出
        shutdown 接线有代码复核证据。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：受控测试及代码复核覆盖权限/不支持/故障状态区分、拒绝后阻断重复请求、适用帮助及重试、输出切换/睡眠后的有界重连。macOS
      真实权限拒绝/撤销、物理输出切换/拔插及系统睡眠唤醒经用户接受延期，保留 NOT RUN / deferred，不把受控证据描述为这些 OS
      交互已实测。
    result: passed
    reason:
      text: 按当前 brief/spec 的受控证据门禁通过。control.rs 测试覆盖权限拒绝在隐藏/恢复后保持阻断；mod.rs
        区分权限、不支持、设备故障及需重启状态，并实现最多三次自动失败尝试、退避及设备/唤醒重连路径。设置测试覆盖平台帮助、手动重试和需重启提示。真实
        macOS 权限拒绝/撤销、输出切换/拔插及睡眠唤醒仍 NOT RUN/deferred，不计作 OS 交互实测通过。
      truncated: false
