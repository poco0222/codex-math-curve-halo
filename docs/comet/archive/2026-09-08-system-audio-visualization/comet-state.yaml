    text: A7：Appearance 的 Renderer 区域新增音频子区，包含开关、强度和真实状态/音量反馈；沿用既有严格单 View 挂载、完整
      settingsStore 和串行保存。切页、切换曲线、重启以及两个既有重置动作均保留音频配置和其他未涉及设置。
    result: passed
    reason:
      text: 保留既有通过结论；Runtime 设置与浏览器检查通过，覆盖 Appearance
        音频子区、真实状态接收、严格切页、共享设置保存、重置保留及单事件订阅。真实 App 观察补充设置保存和重启保留证据。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：新增 UI 支持 en/zh-CN、键盘、清晰焦点和 390px
      窄窗口；实时读数不高频播报。减少动态效果时停止新增音频动效并明确提示，仍可关闭功能。
