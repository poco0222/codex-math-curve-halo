        开启后暂停、归零、显示说明并保留强度，恢复系统偏好后自动恢复等待。
      truncated: false
  - id: A9
    source: brief.md
    text: A9：音频开启时，现有主会话/子代理的颜色、数量、生命周期和状态过渡语义保持有效；不因音乐产生新的会话或虚假工作状态。
