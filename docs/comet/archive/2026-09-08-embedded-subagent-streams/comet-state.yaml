acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: A1 同一 session_id 的主线程与两个不同 agent_id
      的子代理事件写入三份独立匿名快照；子代理启动和停止不覆盖主快照；非法或缺失子代理 ID 不写父状态，普通主线程旧输入继续有效。"
    result: passed
    reason:
      text: 已核对 hook_protocol.rs 的 parse_hook_input、session_key、write_snapshot
        及对应测试：父键保留 SHA256(session_id)，子键按父子身份独立匿名化；SubagentStart/Stop 拒绝缺失、空白及非法
        agent_id，不覆盖父快照。实际 helper 集成覆盖父与两个子代理、重复事件和隐私字段。Runtime Rust 与插件检查通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: A2
      主线程与子状态传入后，两个子代理只在该主线程尾迹内增加色段，主头保持一个；两个主线程各带子代理时恰有两个主头。乱序输入、重复更新不增加头或重置现有\
      运动位置。"
    result: passed
    reason:
      text: halo.js 的 updateSessions 按父键组家族，drawSessions 仅为家族分配主头；子状态只进入尾部
        palette。halo-sessions.test.mjs
        覆盖单父双子、双家族、重排、重复轮询和子成员增减，验证头数、位置与过渡连续。Runtime 测试及关键截图与实现一致。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: A3 子代理完成显示完成色并在既有有效期退出；主线程先完成但子代理仍活动时家族流线继续保留。父 SessionEnd
      清理对应家族，不影响另一个主线程；仅收到子状态时按父身份形成一个家族，不冒充已知父状态。"
    result: passed
    reason:
      text: state.rs 的 is_retained、reduce_snapshots 与 SessionStore
        保留有效子状态需要的父上下文；hook_protocol.rs 的 remove_snapshot 按家族清理且隔离其他父线程。halo.js
        保留完成父头、孤儿使用 idle 回退，并按原始三秒期限退出子完成色。对应 Rust、集成及前端测试通过，含剩余 200/300ms
        的迟到完成回归。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: A4
      子代理色段只采用对应配置状态色，更新、增加和退出连续过渡；头部始终表达父状态。配置色修改同步生效，减少动态效果时保持静态多状态表达；同色或密集子代\
      理仍保留数据身份。"
    result: passed
    reason:
      text: targetColorAt、refreshFamily 和 setSettings
        读取对应配置状态色，保留父头区段、稳定子身份及边界外的状态色；颜色变化、增加和退出使用不超过 420ms
        的过渡。测试覆盖连续更新、配置色同步、减少动态效果；已亲看 reduced-motion.png，静态父子表达及六子代理场景符合规格。
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: A5 旧快照、普通独立线程、已有状态优先级摘要、模拟状态、启动时间边界、未来时间戳、运行态持续保留和光晕开关继续通过回归验证。"
    result: passed
    reason:
      text: 旧 Snapshot 反序列化兼容、有效家族计数、当前状态优先级摘要、模拟恢复和启动边界已逐项核对。main.rs
        在聚合前拒绝启动前、同毫秒及未来快照；父上下文不能绕过过滤。Runtime Rust 140 项、前端与插件 118
        项全部通过，覆盖运行态持续保留、既有独立线程、曲线与光晕开关回归。
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: A6 实际 helper 按插件配置读取受控 Hook
      JSON，产出的父子快照能进入实际聚合与前端渲染合同；浏览器使用实际实现检查 112px/放大、浅色/深色、1/2 主线程、0/2/6
      子代理和完成退出，无运行错误。记录真实宿主发射及 Windows 未验证范围。"
    result: passed
    reason:
      text: task7_integration.rs 使用插件 manifest 命令、本轮 helper 和临时 CODEX_HOME，把受控 Hook
        JSON 送入实际快照及 Rust reducer；check-subagent-flow.mjs 覆盖插件
        launcher→helper→快照→applyRendererDisplayState→实际 Canvas 渲染器。两项 Runtime
        原始结果通过。已核对浏览器验收页、observations.md，并亲看 reduced-motion.png 和
        light-final.png；覆盖 112px/放大、明暗、1/2 主线程、0/2/6 子代理及完成退出，记录无浏览器 error/warn。
      truncated: false
