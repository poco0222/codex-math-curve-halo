acceptance:
  - id: A1
    source: specs/curve-preset-picker/spec.md
    text: Open the visual catalog - **WHEN** 用户打开外观页并激活“更换” - **THEN** 弹层显示现有的全部 20
      项真实轮廓和完整本地化名称，无新增或遗漏 - **AND** 初始焦点落在当前项，当前项位于可见区域且明确标记 - **AND** 标准
      `1130x890` 窗口中图库为 5 列、4 行，开关弹层不改变背景参数区布局
    result: passed
    reason:
      text: settings.html 接入原生 modal dialog；picker-browser 确认 20 项真实缩略图均非空。1130x890
        截图显示 5 列 4 行，当前项有橙色边框与 Current 标记，初始焦点定位当前项。
      truncated: false
  - id: A2
    source: specs/curve-preset-picker/spec.md
    text: Browse without changing settings - **WHEN** 用户悬停、聚焦或通过方向键浏览多个曲线 - **THEN**
      同时运行的局部动画至多一个，曲线轮廓与所示名称匹配 - **AND** 已保存曲线、六项动画值、其他设置和实际桌面悬浮层均不因浏览而改变
    result: passed
    reason:
      text: src/curve-picker.js 的 preview() 先 stopPreview()，只创建单一
        renderer；previewSettings 为本地副本，未调用 IPC。picker-browser
        验证浏览期间保存次数与持久设置不变。真实桌面 Overlay 未运行，不能据此宣称原生 Overlay 不变。
      truncated: false
  - id: A3
    source: specs/curve-preset-picker/spec.md
    text: Apply a different preset - **WHEN** 用户激活与当前曲线不同的预设 - **THEN** 该曲线 ID
      与六项现有默认动画值一次提交给现有保存路径 - **AND** 颜色、透明度、位置、语言及集成设置保持原值 - **AND**
      保存成功后入口、参数和公式显示新曲线，桌面悬浮层通过既有设置事件更新，弹层关闭并恢复焦点
    result: passed
    reason:
      text: "createCurveSelection.persist() 调用 changeCurve() 后经 saveCurrentSettings({
        latest: true }) 进入既有保存队列；changeCurve() 使用 getCurveAnimationSettings()
        恢复六项默认动画值。picker-browser 与完整 Node 测试通过应用、保存、关闭和同步检查。"
      truncated: false
  - id: A4
    source: specs/curve-preset-picker/spec.md
    text: Keep custom values when selecting the current preset - **WHEN**
      当前曲线已自定义动画参数，且用户再次激活该曲线 - **THEN** 弹层关闭并恢复焦点，全部自定义值保持原样 - **AND**
      不执行动画重置或多余保存
    result: passed
    reason:
      text: createCurveSelection.apply() 对当前 curve_id 且无错误状态直接返回 unchanged，不调用
        persist；Node 测试通过同项保留自定义值且无额外保存。
      truncated: false
  - id: A5
    source: specs/curve-preset-picker/spec.md
    text: Retry a failed application - **WHEN** 新预设应用的保存失败 - **THEN**
      弹层保持打开，显示本地化失败信息和重试操作，全局保存状态为 error - **AND** 不显示成功，不把局部预览当作已保存结果 -
      **WHEN** 用户重试 - **THEN** 使用现有保存路径提交当前待保存值，不重复恢复默认值；成功后关闭，失败后仍可重试 - **AND**
      失败后关闭弹层不执行回滚或额外保存，现有全局错误状态继续表达未保存结果
    result: passed
    reason:
      text: 保存失败时 persist() 设置 curveApplyError，picker 保持 dialog 打开并显示本地化失败状态；retry()
        复用当前待保存值，不再次 changeCurve。Node 与 picker-browser 通过失败重试、异常保存和全局 error
        状态检查。
      truncated: false
  - id: A6
    source: specs/curve-preset-picker/spec.md
    text: Dismiss an unused preview - **WHEN** 用户打开并浏览图库后通过关闭按钮、Esc 或遮罩退出，期间没有应用操作 -
      **THEN** 当前曲线和所有参数保持不变，没有保存请求，焦点返回有效入口
    result: passed
    reason:
      text: 关闭按钮、dialog cancel/Esc 和遮罩点击均调用 close()；close() 停止预览、移除监听、关闭 dialog
        并恢复焦点。picker-browser 通过预览不保存及关闭行为检查。
      truncated: false
  - id: A7
    source: specs/curve-preset-picker/spec.md
    text: Remount and synchronize the picker - **WHEN** 用户切换设置页后回到外观页，或收到完整或部分
      `settings-changed` 事件 - **THEN** 入口与选中标记从共享设置重新呈现，未挂载字段与自定义参数不丢失 - **AND**
      已关闭或卸载的图库没有残留动画循环
    result: passed
    reason:
      text: settings.js 的 beforeMount() 销毁旧 curvePicker，appearance bind 重新创建；共享
        settingsStore 保留未挂载字段。settings-tabs、Node remount/sync 和
        animation-browser remount/reload 检查通过，destroy() 清理 renderer 与监听。
      truncated: false
  - id: A8
    source: specs/curve-preset-picker/spec.md
    text: Choose a curve using the keyboard - **WHEN** 用户只使用键盘打开、浏览、应用或关闭图库 -
      **THEN** 所有操作均可完成，焦点不会落入背景控件，聚焦与当前使用状态可区分 - **AND** 方向键不发起保存，Enter 或 Space
      明确应用，关闭后焦点恢复
    result: passed
    reason:
      text: curve-picker.js 实现网格方向键、Home/End、Tab 循环、Enter/Space 原生 button 激活及 Esc
        关闭；picker-browser 通过键盘导航、方向键不保存和焦点恢复检查。
      truncated: false
  - id: A9
    source: specs/curve-preset-picker/spec.md
    text: Use localized and narrow layouts - **WHEN** 使用 `en` 或 `zh-CN`，窗口从
      `1130x890` 缩小到 `390x844` - **THEN** 网格减少列数，完整名称可换行且不遮挡缩略图或相邻项 - **AND**
      页面没有横向溢出，弹层内容必要时内部纵向滚动，全部 20 项和关闭操作始终可达
    result: passed
    reason:
      text: styles.css 桌面使用 5 列；媒体查询在 <=760px 使用 3 列、<=480px 使用 2 列，dialog
        内容支持内部滚动，标签允许换行。en/zh-CN 1130 与 390 截图及 picker-browser 响应式检查通过，无横向溢出，20
        项可达。
      truncated: false
  - id: A10
    source: specs/curve-preset-picker/spec.md
    text: Respect reduced motion - **WHEN** 系统请求 `prefers-reduced-motion` - **THEN**
      所有缩略图和聚焦预览保持静态，选择、焦点及保存反馈正常
    result: passed
    reason:
      text: createCurvePicker() 检查 prefers-reduced-motion；reduced motion 时不启动局部
        renderer，静态缩略图仍由 drawCurveThumbnail() 绘制。picker-browser 通过
        reduced-motion、选择、焦点和保存反馈检查。
      truncated: false
