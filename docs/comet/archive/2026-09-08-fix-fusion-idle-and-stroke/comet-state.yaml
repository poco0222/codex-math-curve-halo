      truncated: false
  - id: A2
    source: brief.md
    text: A2：启动后同一历史会话收到新事件，或新会话产生事件时，正常显示对应流光；首次扫描期间产生的新事件不被当作历史快照丢弃，未来时间戳仍被拒绝。
    result: passed
    reason:
      text: 固定启动边界与扫描应用时刻过滤；当前Runtime通过首次扫描新事件、历史会话新事件、新会话及未来时间戳测试。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：本次启动后收到的运行与等待输入状态超过 60 秒仍显示；终态 3 秒退出、idle 60 秒失效、SessionEnd
      移除及会话隔离保持。再次启动时，这些状态须等待新事件才重新显示。
    result: passed
    reason:
      text: 有效期及隔离未变；Runtime通过运行/input_needed保留、终态3秒、idle边界、SessionEnd与再次启动过滤。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：同曲线同配置下，融合轮廓直接使用配置线宽；流光主体恢复厚度，去除 0.44 缩放和 2.4 固定上限。1、4
      会话不因进入融合模式整体变成细线；13 会话仍保留各自亮芯和必要密度适配。
    result: passed
    reason:
      text: 配置轮廓和主体宽度保持；1/4/13会话检查通过，已亲看112/280px明暗对比，关闭光晕仍厚实。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：多会话配色、身份稳定、420ms 换色、进入退出、模拟隔离和 reduced motion 保持，1、4、13 会话在约 112px
      及放大尺寸可检查。
    result: passed
    reason:
      text: Runtime通过多色、身份、420ms过渡、进出、模拟与reduced motion，20曲线自检通过；已亲看同色交叉截图。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：外观动画设置提供可键盘操作的“光晕”开关；新配置及缺少该字段的旧配置默认关闭。关闭时不画外围光晕，开启时恢复光晕，主体厚度、配色、动画相位和空闲表现不变。选择立即生效、自动保存，切换设置页及重新加载后保持；非法非布尔值不得作为有效配置。
    result: passed
    reason:
      text: 具名原生checkbox及前后端默认false，serde拒绝非布尔；仅严格true绘光晕，主体/相位/idle保持；磁盘true/false保存重读与Chrome空格/自动保存/remount/reload/中英窄屏证据通过。
      truncated: false
