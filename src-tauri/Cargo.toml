[package]
name = "codex-halo"
version = "0.1.0"
description = "Codex Halo desktop companion"
authors = ["Codex Halo"]
edition = "2021"
build = "build.rs"
default-run = "codex-halo"

[lib]
name = "codex_halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-halo-hook"
path = "src/bin/codex-halo-hook.rs"

[[bin]]
name = "codex-halo-watch"
path = "src/bin/codex-halo-watch.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSThread", "NSArray"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
